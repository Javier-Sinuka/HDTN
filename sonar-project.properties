sonar.organization=javier-sinuka
sonar.projectKey=Javier-Sinuka_HDTN
sonar.projectName=HDTN
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Código fuente principal de HDTN.
sonar.sources=common,module,ci,config_files

# Tests del proyecto.
sonar.tests=tests
sonar.test.inclusions=tests/**

# C/C++: archivo generado por Build Wrapper durante el workflow.
sonar.cfamily.compile-commands=build-wrapper-output/compile_commands.json

# Coverage generado por gcovr en formato genérico SonarQube.
sonar.coverageReportPaths=reports/coverage-sonarqube.xml

# Evitamos analizar artefactos, dependencias generadas y salidas del CI.
sonar.exclusions=\
build/**,\
build-wrapper-output/**,\
reports/**,\
.git/**,\
.github/**,\
containers/**,\
building_on_windows/**,\
**/node_modules/**,\
**/coverage/**,\
**/*.md,\
**/*.pptx,\
**/*.pdf,\
**/*.png,\
**/*.jpg,\
**/*.jpeg,\
**/*.gif

# Evitamos contar tests/configuración/CI como código productivo para coverage.
sonar.coverage.exclusions=\
tests/**,\
**/unit_tests/**,\
**/integrated_tests/**,\
**/test/**,\
ci/**,\
config_files/**,\
containers/**,\
building_on_windows/**