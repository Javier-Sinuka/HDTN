sonar.organization=javier-sinuka
sonar.projectKey=Javier-Sinuka_HDTN

sonar.projectName=HDTN
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

sonar.sources=common,module,ci,config_files

sonar.tests=tests
sonar.test.inclusions=tests/**

sonar.cfamily.compile-commands=build-wrapper-output/compile_commands.json

sonar.coverageReportPaths=reports/coverage-sonarqube.xml

sonar.exclusions=\
build/**,\
build-wrapper-output/**,\
reports/**,\
.git/**,\
.github/**,\
containers/**,\
building_on_windows/**,\
**/node_modules/**,\
**/coverage/**,\
**/*.md,\
**/*.pptx,\
**/*.pdf,\
**/*.png,\
**/*.jpg,\
**/*.jpeg,\
**/*.gif

sonar.coverage.exclusions=\
tests/**,\
**/unit_tests/**,\
**/integrated_tests/**,\
**/test/**,\
ci/**,\
config_files/**,\
containers/**,\
building_on_windows/**